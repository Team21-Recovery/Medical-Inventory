<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4F9C">
<title>Medical Supply Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --ink:#18222C; --muted:#5D6B78; --line:#D7DDE2;
  --court:#1E4F9C; --court-ink:#FFFFFF; --court-soft:#E3EBF7;
  --pink:#F0DCF2; --pink-ink:#5B2A63;
  --flag:#C0391E; --flag-bg:#FBE7E2;
  --ok:#2C7A4B; --ok-bg:#E3F2E8;
  --todo:#9AA6B1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --surface:#18212A; --ink:#E8EDF1; --muted:#9BA9B6; --line:#2B3742;
    --court:#4C82D6; --court-ink:#0C1218; --court-soft:#1C2A3D;
    --pink:#3E2843; --pink-ink:#F0CDF5;
    --flag:#FF7A5C; --flag-bg:#3A1F19;
    --ok:#6CCB92; --ok-bg:#183024;
    --todo:#5F6D79;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--court);color:var(--court-ink)}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;padding:12px 16px 8px}
h1{margin:0;font:700 24px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.2px}
.sync{font-size:13px;font-weight:500;opacity:.9;text-align:right;white-space:nowrap}
.sync.bad{color:#FFD2C6;opacity:1}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:transparent;color:inherit;opacity:.78;padding:10px 12px 11px;font:600 16px "Barlow Condensed","Arial Narrow",sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--court-ink)}
.tabs .sep{flex:0 0 1px;background:rgba(255,255,255,.35);margin:10px 4px}

main{max-width:760px;margin:0 auto;padding:14px 12px 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card.accent{border:1.5px solid var(--court)}
h2{font:700 22px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 4px}
h3{font:700 18px/1.15 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px;margin:0}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 6px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--court);color:var(--court-ink)}
.chips{display:flex;gap:6px;margin-top:10px}
.chips button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px;font-weight:600;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.meter{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;display:flex;margin-top:10px}
.meter i{display:block;height:100%}
.meter .m-ok{background:var(--ok)} .meter .m-flag{background:var(--flag)}

section.grp{margin-bottom:18px}
.grp-h{font:700 20px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px 4px;display:flex;justify-content:space-between;align-items:baseline}
.grp-h small{font:500 13px Barlow,sans-serif;color:var(--flag)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 10px 10px 12px;border-top:1px solid var(--line);border-left:5px solid var(--todo)}
.item:first-child{border-top:0}
.item.ok{border-left-color:var(--ok)}
.item.flag{border-left-color:var(--flag);background:var(--flag-bg)}
.item.hide{display:none}
.name{font-weight:600;line-height:1.2}
.note{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.status{font-size:13px;font-weight:600;margin-top:3px;color:var(--muted)}
.flag .status{color:var(--flag)} .ok .status{color:var(--ok)}
.status:empty{display:none}
.ctrl{display:flex;align-items:center;gap:6px}
.target{min-width:44px;height:40px;border:0;border-radius:8px;background:var(--pink);color:var(--pink-ink);font:700 18px "Barlow Condensed",sans-serif;cursor:pointer;padding:0 8px}
.target small{display:block;font:500 10px Barlow,sans-serif;margin-top:-2px}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.step button{width:38px;height:40px;border:0;background:transparent;font-size:22px;font-weight:500;cursor:pointer;color:var(--court)}
.step input{width:50px;height:40px;border:0;text-align:center;font:700 19px "Barlow Condensed",sans-serif;background:var(--surface);-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input::placeholder{color:var(--todo);font-weight:500}
.item .extra{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.item .extra input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);font-size:15px}

.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);font-size:16px;min-width:0;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wide{grid-column:1/-1}
.boxpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.boxpick label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-weight:600;font-size:14px;cursor:pointer}
.boxpick input{width:18px;height:18px;accent-color:var(--court)}
.boxpick small{font-weight:400;color:var(--muted)}
.lvl{display:grid;grid-template-columns:1fr 70px;gap:6px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.lvl:first-of-type{border-top:0}
.lvl input{border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--bg);text-align:center;font-size:15px;width:100%}
.rate{padding:10px 0;border-top:1px solid var(--line)}
.rate:first-of-type{border-top:0}
.rate .rl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-top:4px}
.rate input{width:62px;border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--bg);text-align:center;font-size:15px}

table.t{width:100%;border-collapse:collapse;font-size:15px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:6px 6px;border-bottom:1px solid var(--line)}
.t td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.t .hot{color:var(--flag);font-weight:700}
.tw{overflow-x:auto}
.mini{margin:6px 0 0;padding:0;list-style:none;font-size:15px}
.mini li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.mini li:last-child{border-bottom:0}
.mini b{color:var(--flag)}
.warn{font-size:13px;color:var(--flag);font-weight:600;margin-top:6px}
.empty{color:var(--muted);font-size:15px;margin:4px 0 0}

.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:600;font-size:16px;cursor:pointer}
.btn.primary{background:var(--court);color:var(--court-ink)}
.btn.danger{background:var(--flag);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px}
.link{background:none;border:0;padding:6px 0;color:var(--court);font-weight:600;cursor:pointer;font-size:14px}
.link.danger{color:var(--flag)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.bar-in .btn{flex:1}
:focus-visible{outline:3px solid var(--court);outline-offset:2px}

dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,20,.55)}
.dlg{padding:18px}
.dlg h3{font-size:22px}
.dlg p{margin:0 0 14px;color:var(--muted)}
.dlg-actions{display:flex;gap:8px;margin-top:14px}
.dlg-actions .btn{flex:1}
.err{color:var(--flag);font-size:14px;font-weight:600;min-height:1.2em;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.bdot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.tabs button[aria-selected="true"] .bdot{width:14px;height:14px}
.ctx{background:#0F7C7C;color:#fff}
.ctx-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ctx-in b{font:700 20px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.ctx-in span{font-size:14px;font-weight:600;opacity:.95}
.boxcard{border:0;border-top:8px solid var(--bc)}
.boxtitle{display:flex;align-items:center}
.boxtitle h2{font-size:32px;margin:0}
.boxtitle .bdot{width:18px;height:18px;box-shadow:none}
.boxcard .seg button[aria-pressed="true"]{background:var(--bc);color:#fff}
.bhead{margin:12px 0 0;font-weight:700;display:flex;align-items:center}
.bhead .bdot,.boxpick .bdot,.mini .bdot,.card .bdot{box-shadow:none}
.boxpick label.on{border-color:var(--bc);background:color-mix(in srgb,var(--bc) 12%,transparent)}

.tsel{font-size:13px}
.tsel select{font:600 17px Barlow,sans-serif;padding:11px 10px;border:1.5px solid var(--bc,var(--court));border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.target{min-width:56px}
.target small{font-size:10px;white-space:nowrap}
.target.bare{min-width:44px}
.lvl{grid-template-columns:1fr auto}
.lvl-in{display:flex;align-items:center;gap:6px}
.lvl-in input{width:64px}
.lvl-in small{color:var(--muted);font-size:13px;min-width:52px}

.grid-sel{display:grid;grid-template-columns:minmax(110px,1fr) 2fr;gap:10px}
.events{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.ev{border-top:1px solid var(--line)}
details.ev:first-child{border-top:0}
details.ev summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px;cursor:pointer}
details.ev summary::-webkit-details-marker{display:none}
details.ev summary::after{content:"+";font-weight:600;color:var(--court);margin-left:6px}
details.ev[open] summary::after{content:"−"}
details.ev[open]{background:var(--court-soft)}
.ev-n{font-weight:600;flex:1}
.ev-s{font-size:13px;color:var(--muted);white-space:nowrap}
details.ev > .btn{margin:0 12px 12px;width:calc(100% - 24px)!important}
.inst{background:var(--surface);border:1.5px solid var(--court);border-radius:10px;padding:12px;margin:0 12px 10px}

.orgbar{max-width:760px;margin:0 auto;padding:2px 16px 6px;display:flex;gap:6px}
.orgbar button{flex:1;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:inherit;border-radius:999px;padding:7px 10px;font:700 16px "Barlow Condensed","Arial Narrow",sans-serif;cursor:pointer;letter-spacing:.3px}
.orgbar button[aria-pressed="true"]{background:var(--court-ink);color:var(--court);border-color:var(--court-ink)}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>Medical Supply Inventory</h1><span class="sync" id="sync" role="status"></span></div>
  <div class="orgbar" id="orgbar" role="group" aria-label="Organization"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Inventory areas"></nav>
  <div class="ctx" id="ctx" hidden></div>
</header>
<main id="main"></main>
<div class="bar"><div class="bar-in">
  <button class="btn ghost" id="pdf">Export PDF</button>
  <button class="btn ghost" id="csv">Export CSV</button>
</div></div>

<dialog id="confirm" aria-labelledby="c-h"><div class="dlg">
  <h3 id="c-h"></h3><p id="c-p"></p>
  <div class="dlg-actions"><button class="btn ghost" id="c-cancel">Cancel</button><button class="btn danger" id="c-ok"></button></div>
</div></dialog>

<dialog id="connect" aria-labelledby="k-h"><div class="dlg">
  <h3 id="k-h">Medical Supply Inventory</h3>
  <p>Enter your name and the team code you were given. Your counts are shared with the other Athletic Trainers.</p>
  <div class="grid2">
    <label class="field wide">Your name<input id="k-name" autocomplete="name"></label>
    <label class="field wide">Team code<input id="k-code" autocomplete="off" autocapitalize="off"></label>
  </div>
  <p class="err" id="k-err"></p>
  <div class="dlg-actions"><button class="btn primary" id="k-go">Start counting</button></div>
</div></dialog>
<dialog id="xdlg" aria-labelledby="x-h"><div class="dlg">
  <h3 id="x-h">Add extra supply</h3>
  <div class="grid2">
    <label class="field wide">Item<input id="x-name" placeholder="e.g., Blister pads"></label>
    <label class="field wide">Unit<input id="x-note" placeholder="Optional, e.g., box, roll, bottle"></label>
  </div>
  <label class="switch" style="display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:600;font-size:15px"><input type="checkbox" id="x-in" style="width:20px;height:20px;accent-color:var(--court)"> Kept in every box</label>
  <label class="field" id="x-lvl-wrap" style="margin-top:10px">How many in a full box<input id="x-level" type="number" inputmode="decimal" min="0" step="any" value="1"></label>
  <p class="err" id="x-err"></p>
  <div class="dlg-actions"><button class="btn ghost" id="x-cancel">Cancel</button><button class="btn primary" id="x-save">Add item</button></div>
</div></dialog>
<div class="toast" id="toast"></div>
<script>
/* ====== CONNECT TO YOUR GOOGLE SHEET ======
   Paste the Web app URL from Apps Script between the quotes.
   Leave it empty to run on this device only (handy for testing). */
const API_URL = "https://script.google.com/macros/s/AKfycbzwdShQsA-Y2pVpblWG4bk5Zn9Ws7EN6H7udFN90wdCvC__rahhc89jvQw9aAcaZTU/exec";
/* ========================================== */

(function(){
const LOCAL = !API_URL;
const LS = "msi-v2";

const U={jar:["jar","jars"],box:["box","boxes"],bottle:["bottle","bottles"],ampule:["ampule","ampules"],
  roll:["roll","rolls"],pack:["pack","packs"],tube:["tube","tubes"],sleeve:["sleeve","sleeves"],wrap:["wrap","wraps"]};
// [id, name, full-box quantity, unit]
const BOX_SECTIONS = [
  {title:"Wound care", items:[
    ["2nd-skin","2nd Skin",1,"jar"],["band-aids-1-3-strips","Bandaids – 1x3 Strips",2,"box","300 per box"],
    ["band-aids-4-wing","Bandaids – 4 Wing",2,"box","50 per box"],["band-aids-knuckle","Bandaids – Knuckle",2,"box","100 per box"],
    ["eye-drops","Eye Drops",1,"bottle"],["hand-sanitizer","Hand Sanitizer",1,"bottle"],
    ["hydrocortisone-single-packets","Hydrocortisone Single Packets",1,"box","144 per box"],["hydrogen-peroxide","Hydrogen Peroxide",1,"bottle"],
    ["isopropyl-alcohol","Isopropyl Alcohol",1,"bottle"],["mastisol","Mastisol",10,"ampule"],
    ["non-adherent-pads","Non Adherent Pads",1,"box"],["nose-plugs","Nose Plugs",4,"roll"],
    ["ns-new-sponges","NS New Sponges",1,"box"],["skin-lube","Skin Lube",1,"tube"],
    ["steri-strips","Steri Strips",5,"sleeve"],["sterile-4x4-gauze","Sterile 4x4 Gauze",1,"box"],
    ["triple-antibiotic-single-packets","Triple Antibiotic Single Packets",1,"box"],["wound-wash-saline-spray","Wound Wash Saline Spray",1,"bottle","4 oz can"]]},
  {title:"Tapes", items:[
    ["cover-roll","Cover Roll",1,"roll"],["1-inch-elastikon-or-ac-plus","1-inch Elastikon",1,"box","12 rolls per box"],
    ["inch-tape","¼-inch Tape",2,"box"],["2-inch-elastikon-or-ac-plus","2-inch Elastikon",1,"box","6 rolls per box"]]},
  {title:"Splints & bracing", items:[
    ["36-sam-splint","36\" SAM Splint",3,""],["4-inch-single","4-inch Single",6,"wrap"],
    ["6-inch-double","6-inch Double",4,"wrap"],["6-inch-single","6-inch Single",6,"wrap"],
    ["finger-sam-splint","Finger SAM Splint",12,""],["foam","Foam",1,"roll"],["horseshoe","Horseshoe",1,"pack","pack of 12"],["slings","Slings",2,""]]},
  {title:"Miscellaneous", items:[
    ["acetaminophen-single-dose-packs","Acetaminophen – Single Dose Packs",1,"box","250 packs per box"],["clorox-wipes","Cleaning Wipes",1,""],
    ["gloves-large","Gloves – Large",1,"box"],["gloves-medium","Gloves – Medium",1,"box"],
    ["ibuprofen-single-dose-packs","Ibuprofen – Single Dose Packs",1,"box","250 packs per box"],["scissors","Scissors",1,""],
    ["shark","Shark",1,""],["stop-pain-single-dose-packs","Stop Pain – Single Dose Packs",1,"box"],
    ["tampons","Tampons",1,"box"],["tums-single-dose-packs","Tums – Single Dose Packs",1,"box","250 packs per box"]]}
];
const COURT_SECTION = {title:"Court-based supplies", court:true, items:[
  ["1-white-tape","1½\" White Tape",{rate:2,per:70},"box"],
  ["ecoflex-2","EcoFlex 2\"",{rate:1.5,per:70},"box"],
  ["flexi-wrap","Flexi-wrap",{rate:0,per:70},"roll"],
  ["ice-bags","Ice Bags",{ice:true,rate:1,days:3},"roll"],
  ["powerflex-1","Powerflex 1\"",{rate:1,per:70},"box"],
  ["prewrap","Prewrap",{rate:0.5,per:100},"box"]]};

const mk=(sec,si)=>sec.items.map(([id,name,base,unit,note])=>({id,name,base,unit,note:note||"",sec:si,court:!!sec.court,ice:!!(base&&base.ice)}));
const STD_BOX_ITEMS=BOX_SECTIONS.flatMap(mk);
const COURT_ITEMS=mk(COURT_SECTION,"c");
const ITEM={};[...STD_BOX_ITEMS,...COURT_ITEMS].forEach(i=>ITEM[i.id]=i);
const EXTRA_SECTION={title:"Extra supplies",extra:true};
const EXCESS_SECTIONS=[COURT_SECTION,...BOX_SECTIONS,EXTRA_SECTION];
const BOX_TAB_SECTIONS=[...BOX_SECTIONS,EXTRA_SECTION];

const ORGS=["JVA","3Step"];
const EVENTS={
  "3Step":[["Boys Winter Invitational",2],["MEPL",2],["Bluegrass",2],["Players Championship",2]],
  "JVA":[["The Reckoning",2],["Chi Town (Fall)",2],["Rock N Rumble",1],["Brew City",1],["Charm City",2],
    ["World Challenge",3],["West Coast",1],["Portland",""],["Summerfest",1],["Windy City Round Up (June)",1],["Boys National Championship",2]]
};
const DEFAULT_CFG=()=>({extras:[],boxes:[{id:"b1",name:"Box 1",org:"JVA"},{id:"b2",name:"Box 2",org:"JVA"},{id:"b3",name:"Box 3",org:"JVA"},{id:"sA",name:"Box A",org:"3Step"},{id:"sB",name:"Box B",org:"3Step"},{id:"sC",name:"Box C",org:"3Step"}],tournaments:[],targets:{},rates:{},comments:{}});

/* ---------- state ---------- */
let L={name:"",code:"",admin:"",cfg:DEFAULT_CFG(),counts:{},pending:{},tab:"",phase:{},filter:"all",lastSync:0,cur:"",plan:"all",showPast:false};
try{const r=localStorage.getItem(LS);if(r){const p=JSON.parse(r);L=Object.assign(L,p);L.cfg=Object.assign(DEFAULT_CFG(),p.cfg||{});}}catch(e){}
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(L))}catch(e){}};
const isAdmin=()=>LOCAL||!!L.admin;

const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const has=v=>v!==null&&v!==undefined&&v!=="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const K=(loc,item,phase)=>`${loc}|${item}|${phase}`;
const get=(loc,item,phase)=>{const v=L.counts[K(loc,item,phase)];return has(v)?num(v):null;};
const fmt=n=>Math.round(n*100)/100;
function fmtDate(d){if(!d)return"";const[y,m,da]=d.split("-").map(Number);return new Date(y,m-1,da).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});}
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};

/* ---------- units ---------- */
function unitWord(it,n){
  if(!it.unit)return "";
  const u=U[it.unit];
  return u?u[n===1?0:1]:it.unit;
}
const qty=(it,n)=>{const w=unitWord(it,n);return `${fmt(n)}${w?" "+w:""}`;};
const unitPlural=it=>it.unit?(U[it.unit]?U[it.unit][1]:it.unit):"";

/* ---------- boxes, items ---------- */
const DEFAULT_3STEP=[{id:"sA",name:"Box A",org:"3Step"},{id:"sB",name:"Box B",org:"3Step"},{id:"sC",name:"Box C",org:"3Step"}];
function allBoxes(){
  if(!Array.isArray(L.cfg.boxes))L.cfg.boxes=[];
  L.cfg.boxes.forEach(b=>{if(b.org!=="JVA"&&b.org!=="3Step")b.org="JVA";});
  if(!L.cfg.boxes.some(b=>b.org==="3Step"))DEFAULT_3STEP.forEach(d=>L.cfg.boxes.push(Object.assign({},d)));
  return L.cfg.boxes;
}
const boxes=(org)=>allBoxes().filter(b=>b.org===(org||curOrg()));
const extras=()=>(L.cfg.extras||[]).map(x=>({id:x.id,name:x.name||"Unnamed item",unit:x.unit||x.note||"",base:x.inBoxes?num(x.level):0,sec:"x",extra:true,inBoxes:!!x.inBoxes}));
const boxItemsAll=()=>[...STD_BOX_ITEMS,...extras().filter(x=>x.inBoxes)];
const excessItemsAll=()=>[...COURT_ITEMS,...STD_BOX_ITEMS,...extras()];
const itm=id=>ITEM[id]||extras().find(x=>x.id===id);
const secTitle=it=>it.court?COURT_SECTION.title:it.extra?EXTRA_SECTION.title:BOX_SECTIONS[it.sec].title;
const BOX_COLORS=["#0F7C7C","#C2570A","#6B3FA0","#2E7D32","#B0306A","#8A6A00","#3D5A80","#9C3D2E"];
const boxColor=id=>{const bx=allBoxes().find(b=>b.id===id);const i=bx?boxes(bx.org).indexOf(bx):0;return BOX_COLORS[(i<0?0:i)%BOX_COLORS.length];};
const dot=id=>`<span class="bdot" style="background:${boxColor(id)}"></span>`;
const boxName=id=>(allBoxes().find(b=>b.id===id)||{}).name||"Box";
const target=it=>has(L.cfg.targets[it.id])?num(L.cfg.targets[it.id]):it.base;
const rate=it=>Object.assign({},it.base,L.cfg.rates[it.id]||{});

/* ---------- tournaments & sessions ---------- */
const tours=()=>L.cfg.tournaments||[];
const sortedTours=()=>tours().map((t,i)=>[t,i]).sort((a,b)=>{
  const da=a[0].date||"9999",db=b[0].date||"9999";return da<db?-1:da>db?1:a[1]-b[1];}).map(x=>x[0]);
const tourById=id=>tours().find(t=>t.id===id);
const tourLabel=t=>t?`${t.name||"Untitled tournament"} (${t.date?fmtDate(t.date):"date not set"})`:"";
const orgLabel=t=>t?`${t.org?t.org+": ":""}${tourLabel(t)}`:"";
const isUpcoming=t=>!!t.date&&t.date>todayStr();
const isPast=t=>!!t.date&&!isUpcoming(t);
const tourOrg=t=>t&&ORGS.includes(t.org)?t.org:"JVA";
const orgList=()=>ORGS;
const curOrg=()=>ORGS.includes(L.org)?L.org:ORGS[0];
const orgTours=()=>sortedTours().filter(t=>tourOrg(t)===curOrg());
const excessLoc=(org)=>(org||curOrg())==="JVA"?"excess":"excess-3step";
const isExcessLoc=loc=>loc==="excess"||loc==="excess-3step";
const upcoming=(org)=>sortedTours().filter(t=>tourOrg(t)===(org||curOrg())&&isUpcoming(t));
const LEGACY="legacy";
const hasLegacy=(org)=>(org||curOrg())==="JVA"&&Object.keys(L.counts).some(k=>{const loc=k.split("|")[0];return !isExcessLoc(loc)&&!loc.includes("~");});
const sessLoc=(tid,bid)=>tid===LEGACY?bid:`${tid}~${bid}`;
const sessions=(org)=>{const o=org||curOrg();return [...(hasLegacy(o)?[LEGACY]:[]),...sortedTours().filter(t=>tourOrg(t)===o).map(t=>t.id)];};
const sessName=tid=>{if(tid===LEGACY)return "Earlier counts";const t=tourById(tid);if(!t)return "Untitled tournament";const dup=tours().filter(x=>x.name===t.name&&x.org===t.org).length>1;return `${t.name||"Untitled tournament"}${dup&&t.date?` (${fmtDate(t.date)})`:""}`;};
function defaultCur(org){
  org=org||curOrg();
  const T=sortedTours().filter(t=>tourOrg(t)===org);
  if(!T.length)return hasLegacy(org)?LEGACY:"";
  const today=todayStr();
  const span=T.find(t=>{if(!t.date)return false;const e=new Date(t.date);e.setDate(e.getDate()+Math.max(0,num(t.days)-1));
    const es=`${e.getFullYear()}-${String(e.getMonth()+1).padStart(2,"0")}-${String(e.getDate()).padStart(2,"0")}`;return t.date<=today&&today<=es;});
  if(span)return span.id;
  const past=T.filter(t=>t.date&&t.date<=today);
  if(past.length)return past[past.length-1].id;
  const up=T.filter(isUpcoming);return (up[0]||T[0]).id;
}
function curTour(){
  L.curBy=L.curBy||{};const o=curOrg();const c=L.curBy[o]||{};
  if(c.day!==todayStr()||!sessions().includes(c.id)){L.curBy[o]={id:defaultCur(o),day:""};}
  return L.curBy[o].id;
}
function pickTour(id){L.curBy=L.curBy||{};L.curBy[curOrg()]={id,day:todayStr()};persist();}
const needsSeed=()=>!tours().some(t=>ORGS.includes(t.org));
function migrateOrgs(){
  if(!isAdmin()||L.orgMigrated||(!LOCAL&&!loadedOnce))return;
  allBoxes();saveCfg("boxes",0);
  let changed=false;
  tours().forEach(t=>{if(!ORGS.includes(t.org)){t.org="JVA";changed=true;}
    const keep=(t.boxes||[]).filter(b=>boxes(t.org).some(x=>x.id===b));if(keep.length!==(t.boxes||[]).length){t.boxes=keep;changed=true;}});
  if(changed)saveCfg("tournaments",0);
  L.orgMigrated=true;persist();
}
function seedTournaments(){
  const add=[];let n=0;
  ORGS.forEach(org=>EVENTS[org].forEach(([name,locs])=>add.push({id:"t"+Date.now().toString(36)+(n++).toString(36),org,name,date:"",courts:"",locs:String(locs),days:"",boxes:[]})));
  L.cfg.tournaments=[...tours(),...add];saveCfg("tournaments",0);
}
function curBoxes(){
  const tid=curTour();const t=tourById(tid);
  const assigned=t?(t.boxes||[]).filter(b=>boxes().some(x=>x.id===b)):[];
  return assigned.length?boxes().filter(b=>assigned.includes(b.id)):boxes();
}
/* latest count for a box, newest tournament first; optionally only before a tournament */
function boxState(bid,id,beforeTid,org){
  const bx=allBoxes().find(b=>b.id===bid);
  let S=sessions(org||(bx&&bx.org));
  if(beforeTid){const i=S.indexOf(beforeTid);S=i<0?S:S.slice(0,i);}
  for(let i=S.length-1;i>=0;i--){
    const loc=sessLoc(S[i],bid);const p=get(loc,id,"post");if(p!==null)return {v:p,tid:S[i],phase:"post"};
    const q=get(loc,id,"pre");if(q!==null)return {v:q,tid:S[i],phase:"pre"};
  }
  return null;
}
const shortfall=(bid,it)=>{const s=boxState(bid,it.id);return s?Math.max(0,target(it)-s.v):0;};
const shortfallIn=(bid,it,org)=>{const s=boxState(bid,it.id,null,org);return s?Math.max(0,target(it)-s.v):0;};
const uncounted=bid=>boxItemsAll().filter(it=>!boxState(bid,it.id)).length;
function courtNeed(t,it){
  const r=rate(it);
  if(it.ice) return num(r.days)>0?Math.ceil(num(r.rate)*num(t.days)/num(r.days)-1e-9):0;
  if(!num(r.per))return 0;
  return Math.ceil(num(r.rate)*num(t.days)*num(t.locs)*num(t.courts)/num(r.per)-1e-9);
}
/* plan: each box counted once (first upcoming tournament it's assigned to) */
function plan(list){
  const seen=new Set();const perTour=[];
  list.forEach(t=>{const bx=(t.boxes||[]).filter(b=>boxes(tourOrg(t)).some(x=>x.id===b));
    const mine=bx.filter(b=>!seen.has(b));mine.forEach(b=>seen.add(b));perTour.push({t,boxes:mine,dup:bx.filter(b=>!mine.includes(b))});});
  return {perTour,boxes:[...seen]};
}
function needs(list){
  const P=plan(list);const m={};
  excessItemsAll().forEach(it=>{
    let n=0;
    if(it.court)list.forEach(t=>n+=courtNeed(t,it));
    else if(!it.extra||it.inBoxes)P.boxes.forEach(b=>n+=shortfallIn(b,it,orgOf(list)));
    m[it.id]=n;
  });
  return m;
}
const planList=()=>L.plan!=="all"&&upcoming().some(t=>t.id===L.plan)?[tourById(L.plan)]:upcoming();
const orgOf=list=>list.length?tourOrg(list[0]):curOrg();
/* ---------- sync ---------- */
let loadedOnce=false;
let syncState=LOCAL?"local":"idle", flushing=false, flushTimer=null, lastFlushDone=0;
function setSync(s){syncState=s;const el=document.getElementById("sync");
  const map={local:"On this device",idle:L.lastSync?`Synced ${new Date(L.lastSync).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`:"Connecting…",
    saving:"Saving…",offline:"Offline, saved on this phone",error:"Not synced"};
  el.textContent=map[s]||"";el.classList.toggle("bad",s==="offline"||s==="error");}
async function api(body){
  const res=await fetch(API_URL,{method:"POST",redirect:"follow",body:JSON.stringify(Object.assign({},body,{code:L.code,admin:L.admin,by:L.name}))});
  return res.json();
}
function locLabel(loc){
  if(loc==="excess")return "JVA Excess";
  if(loc==="excess-3step")return "3Step Excess";
  if(!loc.includes("~"))return `Earlier counts / ${boxName(loc)}`;
  const [tid,bid]=loc.split("~");return `${sessName(tid)} / ${boxName(bid)}`;
}
function setCount(loc,item,phase,v){
  const k=K(loc,item,phase);
  if(has(v)) L.counts[k]=num(v); else delete L.counts[k];
  L.pending[k]={loc,item,phase,value:has(v)?num(v):null,locName:locLabel(loc),itemName:(itm(item)||{name:item}).name};
  persist();scheduleFlush();
}
function scheduleFlush(ms=1200){if(LOCAL){L.pending={};persist();return;}clearTimeout(flushTimer);flushTimer=setTimeout(flush,ms);}
async function flush(){
  if(LOCAL||flushing)return;
  const batch=Object.entries(L.pending);if(!batch.length){setSync("idle");return;}
  flushing=true;setSync("saving");
  try{
    const r=await api({action:"counts",changes:batch.map(([,v])=>v)});
    if(!r.ok)throw r;
    batch.forEach(([k,v])=>{if(L.pending[k]&&L.pending[k].value===v.value)delete L.pending[k];});
    L.lastSync=Date.now();lastFlushDone=Date.now();persist();setSync("idle");
  }catch(e){
    if(e&&e.error==="bad_code"){lockOut();}
    else{setSync("offline");clearTimeout(flushTimer);flushTimer=setTimeout(flush,15000);}
  }finally{flushing=false;if(Object.keys(L.pending).length&&syncState==="idle")scheduleFlush(300);}
}
async function load(){
  if(LOCAL){setSync("local");return true;}
  const started=Date.now();
  try{
    const r=await api({action:"load"});
    if(!r.ok){if(r.error==="bad_code"){lockOut();return false;}throw r;}
    if(lastFlushDone>started||lastCfgDone>started||flushing){setTimeout(load,800);return true;}
    const cfg=DEFAULT_CFG();Object.keys(r.config||{}).forEach(k=>cfg[k]=r.config[k]);
    Object.keys(cfgDirty).forEach(k=>{if(k in L.cfg)cfg[k]=L.cfg[k];}); // keep unsaved setup edits
    L.cfg=cfg;loadedOnce=true;
    const counts={};(r.counts||[]).forEach(([loc,item,phase,v])=>counts[K(loc,item,phase)]=v);
    Object.entries(L.pending).forEach(([k,p])=>{if(has(p.value))counts[k]=p.value;else delete counts[k];});
    L.counts=counts;
    if(L.admin&&!r.admin){L.admin="";toast("Admin code no longer valid");}
    L.lastSync=Date.now();persist();setSync(Object.keys(L.pending).length?"saving":"idle");
    if(Object.keys(L.pending).length)scheduleFlush(200);
    return true;
  }catch(e){setSync("offline");return true;}
}
const cfgTimers={}, cfgDirty={};
let lastCfgDone=0;
function saveCfg(key,ms=700){
  persist();if(LOCAL)return;
  cfgDirty[key]=(cfgDirty[key]||0)+1;
  clearTimeout(cfgTimers[key]);
  cfgTimers[key]=setTimeout(async()=>{
    const ver=cfgDirty[key];
    setSync("saving");
    try{const r=await api({action:"config",key,value:L.cfg[key]});
      if(!r.ok){if(r.error==="bad_admin"){delete cfgDirty[key];L.admin="";persist();render();toast("Setup is locked. Enter the admin code again.");return;}else throw r;}
      if(cfgDirty[key]===ver)delete cfgDirty[key];
      lastCfgDone=Date.now();L.lastSync=Date.now();setSync("idle");
    }catch(e){setSync("offline");toast("Setup change didn’t save. Retrying…");saveCfg(key,15000);cfgDirty[key]--;}
  },ms);
}
function lockOut(){L.code="";persist();showConnect("That team code didn’t work. Check it and try again.");}

/* ---------- UI helpers ---------- */
const $=s=>document.querySelector(s);
const main=()=>document.getElementById("main");
let tt;function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2200);}
function openDlg(d){d.showModal?d.showModal():d.setAttribute("open","");}

function confirmDlg(title,msg,ok){

function tourOptions(selected,includeLegacy=true,org){
  let T=sortedTours();if(org)T=T.filter(t=>tourOrg(t)===org);
  const up=T.filter(isUpcoming),past=T.filter(isPast),nod=T.filter(t=>!t.date);
  const opt=t=>`<option value="${esc(t.id)}" ${t.id===selected?"selected":""}>${esc(tourLabel(t))}</option>`;
  return (past.length?`<optgroup label="Past and current">${past.map(opt).join("")}</optgroup>`:"")+
    (up.length?`<optgroup label="Upcoming">${up.map(opt).join("")}</optgroup>`:"")+
    (nod.length?`<optgroup label="Date not set">${nod.map(opt).join("")}</optgroup>`:"")+
    (includeLegacy&&hasLegacy(org)?`<option value="${LEGACY}" ${selected===LEGACY?"selected":""}>Earlier counts (before tournaments)</option>`:"");
}

/* ---------- tabs ---------- */
function validTab(){
  const t=L.tab;const vis=curBoxes();
  if(t.startsWith("box:")&&vis.some(b=>"box:"+b.id===t))return t;
  if(["excess","restock","setup"].includes(t))return t;
  return vis[0]?"box:"+vis[0].id:"excess";
}
function renderTabs(){
  curTour();L.tab=validTab();
  const el=$("#tabs");
  el.innerHTML=curBoxes().map(b=>`<button role="tab" data-tab="box:${b.id}" aria-selected="${L.tab==="box:"+b.id}">${dot(b.id)}${esc(b.name)}</button>`).join("")+
    `<button role="tab" data-tab="excess" aria-selected="${L.tab==="excess"}">Excess</button><span class="sep"></span>`+
    `<button role="tab" data-tab="restock" aria-selected="${L.tab==="restock"}">Restock</button>`+

function ensureBox3(){
  if(L.box3Added||!isAdmin()||(!LOCAL&&!loadedOnce))return;
  if(!allBoxes().some(b=>b.id==="b3"||(b.org==="JVA"&&b.name.trim().toLowerCase()==="box 3"))){allBoxes().push({id:"b3",name:"Box 3",org:"JVA"});saveCfg("boxes",0);}

function renderOrgBar(){
  const el=$("#orgbar");
  el.innerHTML=ORGS.map(o=>`<button data-o="${o}" aria-pressed="${o===curOrg()}">${o}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.dataset.o===curOrg())return;L.org=b.dataset.o;L.plan="all";L.openEv="";persist();render();window.scrollTo({top:0});});

function render(){
  ensureBox3();migrateOrgs();renderOrgBar();
  renderTabs();renderCtx();
  const t=L.tab;
  if(t.startsWith("box:"))renderBox(t.slice(4));
  else if(t==="excess")renderExcess();

function softRefresh(){
  const a=document.activeElement;
  const typing=a&&main().contains(a)&&(a.tagName==="INPUT"||a.tagName==="SELECT");
  const before=L.tab;renderTabs();
  if(L.tab!==before){render();return;}
  renderOrgBar();
  if((L.tab.startsWith("box:")&&curTour())||L.tab==="excess"){renderCtx();updateRows();}
  else if(!typing)render();
}

    <div><span class="name">${esc(it.name)}${(()=>{const bits=[it.note,!withTarget&&unitPlural(it)?`count in ${unitPlural(it)}`:""].filter(Boolean);return bits.length?`<span class="note">${esc(bits.join(", "))}</span>`:"";})()}</span><div class="status"></div></div>

    ${it.ice&&!withTarget?`<div class="extra">Notes<input type="text" data-comment placeholder="e.g., extra for outdoor courts"></div>`:""}

let rowCtx=null;
function wireRows(loc,phaseFn){
  rowCtx={loc,phaseFn};
  main().querySelectorAll(".item").forEach(row=>{
    const id=row.dataset.id, inp=row.querySelector(".step input");
    const cur=()=>get(loc,id,phaseFn());
    row.querySelectorAll(".step button").forEach(b=>b.onclick=()=>{
      const c=cur();const d=num(b.dataset.d);
      const n=c===null?(d>0?1:0):Math.max(0,c+d);
      setCount(loc,id,phaseFn(),fmt(n));updateRows();
    });
    inp.oninput=()=>{setCount(loc,id,phaseFn(),inp.value===""?null:Math.max(0,num(inp.value)));updateRows(row);};
    const tb=row.querySelector(".target");
    if(tb)tb.onclick=()=>{setCount(loc,id,phaseFn(),target(itm(id)));updateRows();};
    const cm=row.querySelector("[data-comment]");
    if(cm){cm.value=L.cfg.comments[id]||"";cm.oninput=()=>{L.cfg.comments[id]=cm.value;saveCfg("comments",1200);};}
  });
}
function updateRows(skipRow){
  if(!rowCtx)return;
  const {loc,phaseFn}=rowCtx;const phase=phaseFn();
  const N=isExcessLoc(loc)?needs(upcoming()):null;
  const [tid,bid]=loc.includes("~")?loc.split("~"):[LEGACY,loc];
  let ok=0,fl=0,todo=0;const secFlags={};
  main().querySelectorAll(".item").forEach(row=>{
    const it=itm(row.dataset.id);if(!it)return;const inp=row.querySelector(".step input");
    const c=get(loc,it.id,phase);
    if(row!==skipRow&&document.activeElement!==inp)inp.value=c===null?"":c;
    let k="todo",msg="";
    if(isExcessLoc(loc)){
      const need=N[it.id]||0;
      if(c===null){msg=need?`Upcoming tournaments need ${qty(it,need)}`:"";}
      else if(c<need){k="flag";msg=`Short ${qty(it,need-c)} (need ${fmt(need)})`;}
      else{k="ok";msg=need?`Covers the ${fmt(need)} needed`:"Counted";}
    }else{
      const t=target(it);
      const tbn=row.querySelector(".target");
      if(tbn){const w=unitWord(it,t);tbn.innerHTML=`${fmt(t)}${w?`<small>${esc(w)}</small>`:""}`;tbn.classList.toggle("bare",!w);}
      const pre=get(loc,it.id,"pre");const bits=[];
      if(c!==null){ if(!t){k="ok";bits.push("Counted");} else if(c<t){k="flag";bits.push(`Restock ${qty(it,t-c)}`);} else {k="ok";bits.push("Full");} }
      if(phase==="post"&&pre!==null){bits.push(`started with ${fmt(pre)}`);if(c!==null)bits.push(`used ${fmt(Math.max(0,pre-c))}`);}
      if(phase==="pre"&&c===null&&tid!==LEGACY){const prev=boxState(bid,it.id,tid);if(prev)bits.push(`last count ${fmt(prev.v)} after ${sessName(prev.tid)}`);}
      msg=bits.join(", ");if(msg)msg=msg[0].toUpperCase()+msg.slice(1);
    }
    row.classList.remove("ok","flag");if(k!=="todo")row.classList.add(k);
    row.querySelector(".status").textContent=msg;
    row.classList.toggle("hide",L.filter!=="all"&&k!==L.filter);
    const sk=row.closest("section").dataset.s;
    if(k==="ok")ok++;else if(k==="flag"){fl++;secFlags[sk]=(secFlags[sk]||0)+1;}else todo++;
  });
  main().querySelectorAll("section.grp").forEach(s=>{
    const f=secFlags[s.dataset.s]||0;s.querySelector(".grp-h small").textContent=f?`${f} ${isExcessLoc(loc)?"short":"to restock"}`:"";
    s.style.display=(s.classList.contains("extra-grp")&&L.filter==="all")||s.querySelectorAll(".item:not(.hide)").length?"":"none";
  });
  const total=Math.max(1,ok+fl+todo);
  const tl=$("#tally");if(tl)tl.textContent=`${ok+fl} of ${ok+fl+todo} counted, ${fl} ${isExcessLoc(loc)?"short":"to restock"}`;
  const m=$("#meter");if(m){m.children[0].style.width=(ok/total*100)+"%";m.children[1].style.width=(fl/total*100)+"%";}
}

function orderRows(list){
  const N=needs(list);
  const xl=excessLoc(orgOf(list));
  return excessItemsAll().map(it=>{const need=N[it.id]||0;const ex=get(xl,it.id,"now");
    return {it,need,ex,order:Math.max(0,need-(ex||0))};}).filter(r=>r.need>0);
}
function shortList(bid){
  const need=boxItemsAll().map(it=>[it,shortfall(bid,it)]).filter(([,n])=>n>0);

}

      ${BOX_SECTIONS.map((sec,si)=>`<p style="margin:14px 0 2px;font-weight:600">${esc(sec.title)}</p>${STD_BOX_ITEMS.filter(i=>i.sec===si).map(it=>
        `<div class="lvl"><span>${esc(it.name)}</span><span class="lvl-in"><input data-lvl="${it.id}" type="number" inputmode="decimal" step="any" min="0" value="${target(it)}"><small>${esc(unitWord(it,target(it)))}</small></span></div>`).join("")}`).join("")}</div>`;
    h+=extrasSetupHTML();
    if(!LOCAL)h+=`<div class="card"><button class="link danger" id="s-lock">Lock setup on this device</button></div>`;
  }
  main().innerHTML=h;
  if(!LOCAL&&$("#s-sync"))$("#s-sync").textContent=$("#sync").textContent;
  $("#s-name").oninput=e=>{L.name=e.target.value.trim();persist();};
  if($("#s-refresh"))$("#s-refresh").onclick=async()=>{await flush();await load();render();toast("Up to date");};
  if(!A){
    $("#s-unlock").onclick=async()=>{
      const v=$("#s-admin").value.trim();if(!v)return;
      try{const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"checkAdmin",code:L.code,admin:v})}).then(x=>x.json());
        if(r.ok){L.admin=v;persist();render();toast("Setup unlocked");}else $("#s-err").textContent="That admin code didn’t work.";
      }catch(e){$("#s-err").textContent="Can’t check the code while offline.";}
    };
    return;
  }
  if($("#s-lock"))$("#s-lock").onclick=()=>{L.admin="";persist();render();};
  const sorg=curOrg();
  main().querySelectorAll("details.ev").forEach(d=>d.addEventListener("toggle",()=>{if(!d.isConnected)return;if(d.open){L.openEv=sorg+"|"+d.dataset.ev;main().querySelectorAll("details.ev").forEach(o=>{if(o.dataset.ev!==d.dataset.ev&&o.open)o.open=false;});}else if(L.openEv===sorg+"|"+d.dataset.ev)L.openEv="";persist();}));
  const newTour=(name,src)=>{const def=(EVENTS[sorg]||[]).find(e=>e[0]===name);
    const t={id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),org:sorg,name,date:"",
      courts:src?src.courts:"",locs:src?src.locs:(def?String(def[1]):""),days:src?src.days:"",boxes:src?[...(src.boxes||[])]:boxes().map(b=>b.id)};
    L.cfg.tournaments=[...tours(),t];L.openEv=sorg+"|"+name;saveCfg("tournaments",0);renderSetup();
    setTimeout(()=>{const c=main().querySelector(`[data-t="${t.id}"]`);if(c){if(c.scrollIntoView)c.scrollIntoView({block:"center"});(c.querySelector("[data-k=name]")||c.querySelector("[data-k=date]")).focus();}},50);};
  main().querySelectorAll("[data-add-date]").forEach(b=>b.onclick=()=>{const name=b.dataset.addDate;
    const prev=sortedTours().filter(t=>tourOrg(t)===sorg&&t.name===name);newTour(name,prev[prev.length-1]);});
  $("#add-custom").onclick=()=>newTour("",null);
  main().querySelectorAll("[data-t]").forEach(card=>{
    const tid=card.dataset.t, T=()=>tourById(tid);
    card.querySelectorAll("[data-k]").forEach(inp=>{
      inp.oninput=()=>{const t=T();if(!t)return;t[inp.dataset.k]=inp.value;saveCfg("tournaments");renderTabs();};
      if(inp.dataset.k==="date"||inp.dataset.k==="name")inp.onchange=()=>{const t=T();if(t&&inp.dataset.k==="name")L.openEv=sorg+"|"+t.name;saveCfg("tournaments");persist();renderSetup();};
    });
    card.querySelectorAll("[data-box]").forEach(cb=>cb.onchange=()=>{
      const t=T();if(!t)return;const b=cb.dataset.box;
      t.boxes=(t.boxes||[]).filter(x=>x!==b);if(cb.checked)t.boxes.push(b);
      saveCfg("tournaments",0);renderSetup();
    });
    card.querySelector("[data-del-t]").onclick=async()=>{
      const t=T();if(!t)return;
      if(!await confirmDlg(`Remove ${tourLabel(t)}?`,"This also deletes every count logged for this date, for everyone. This can’t be undone.","Remove"))return;
      if(!await clearLocs(boxes().map(b=>sessLoc(tid,b.id)))){toast("Couldn’t remove while offline.");return;}
      Object.keys(L.counts).forEach(k=>{if(k.startsWith(tid+"~"))delete L.counts[k];});
      L.cfg.tournaments=tours().filter(x=>x.id!==tid);saveCfg("tournaments",0);render();
    };
  });
  $("#add-b").onclick=()=>{const o=curOrg();const id=(o==="JVA"?"b":"s")+Date.now().toString(36);
    const n=boxes().length;const name=o==="JVA"?`Box ${n+1}`:`Box ${String.fromCharCode(65+n)}`;
    allBoxes().push({id,name,org:o});saveCfg("boxes",0);render();};
  main().querySelectorAll("[data-b]").forEach(row=>{
    const bid=row.dataset.b, B=()=>allBoxes().find(x=>x.id===bid);
    row.querySelector(".bname").oninput=e=>{const b=B();if(!b)return;b.name=e.target.value;saveCfg("boxes");renderTabs();};
    row.querySelector("[data-del-b]").onclick=async()=>{
      const b=B();if(!b)return;
      if(!await confirmDlg(`Remove ${b.name}?`,"This deletes the box and all of its counts from every tournament, for everyone. This can’t be undone.","Remove box"))return;
      if(!await clearLocs([bid,...tours().map(t=>sessLoc(t.id,bid))])){toast("Couldn’t remove while offline.");return;}
      Object.keys(L.counts).forEach(k=>{const loc=k.split("|")[0];if(loc===bid||loc.endsWith("~"+bid))delete L.counts[k];});
      L.cfg.boxes=allBoxes().filter(x=>x.id!==bid);
      tours().forEach(o=>o.boxes=(o.boxes||[]).filter(x=>x!==bid));
      saveCfg("boxes",0);saveCfg("tournaments",0);render();
    };
  });
  main().querySelectorAll("[data-r]").forEach(row=>row.querySelectorAll("[data-rk]").forEach(inp=>inp.oninput=()=>{
    const id=row.dataset.r;L.cfg.rates[id]=Object.assign({},L.cfg.rates[id]||{},{[inp.dataset.rk]:inp.value});saveCfg("rates");}));
  main().querySelectorAll("[data-lvl]").forEach(inp=>inp.oninput=()=>{
    L.cfg.targets[inp.dataset.lvl]=inp.value===""?null:num(inp.value);saveCfg("targets");
    const it=itm(inp.dataset.lvl);inp.nextElementSibling.textContent=unitWord(it,target(it));});
}

/* ---------- exports ---------- */
function stamp(){return new Date().toISOString().slice(0,10);}
function saveFile(name,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
const csvCell=v=>{v=String(v??"");return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;};
function boxRows(tid,bid){
  const loc=sessLoc(tid,bid);
  return boxItemsAll().map(it=>{const pre=get(loc,it.id,"pre"),post=get(loc,it.id,"post"),t=target(it),cur=post!==null?post:pre;
    return {it,full:t,pre,post,used:pre!==null&&post!==null?fmt(Math.max(0,pre-post)):"",restock:cur!==null&&cur<t?fmt(t-cur):""};});
}
const sessionHasCounts=(tid,bid)=>boxItemsAll().some(it=>get(sessLoc(tid,bid),it.id,"pre")!==null||get(sessLoc(tid,bid),it.id,"post")!==null);
function buildCSV(){
  const o=[];
  o.push(["Medical Supply Inventory"],["Exported",new Date().toLocaleString(),"By",L.name||""],[]);
  o.push(["Tournament history"],["Organization","Tournament","Start date","Box","Section","Item","Unit","Full box","Pre count","Post count","Used","Restock"]);
  ORGS.forEach(org=>sessions(org).forEach(tid=>{const t=tourById(tid);
    boxes(org).forEach(b=>{if(!sessionHasCounts(tid,b.id))return;
      boxRows(tid,b.id).forEach(r=>o.push([org,t?t.name:sessName(tid),t?t.date:"",b.name,secTitle(r.it),r.it.name,unitPlural(r.it),r.full,r.pre??"",r.post??"",r.used,r.restock]));});}));
  o.push([],["Tournaments"],["Organization","Tournament","Start date","Courts","AT locations","Days","Boxes"]);
  sortedTours().forEach(t=>o.push([tourOrg(t),t.name,t.date,num(t.courts),num(t.locs),num(t.days),(t.boxes||[]).map(boxName).join("; ")]));
  ORGS.forEach(org=>{const UP=upcoming(org);
    o.push([],[`${org} order list (all upcoming ${org} tournaments)`],["Item","Unit","Needed","In excess","To order"]);
    orderRows(UP).forEach(r=>o.push([r.it.name,unitPlural(r.it),fmt(r.need),r.ex===null?"":r.ex,fmt(r.order)]));
  });
  ORGS.forEach(org=>{const N=needs(upcoming(org));const xl=excessLoc(org);
    o.push([],[`${org} excess inventory`],["Section","Item","Unit","On hand","Needed for upcoming","Short","Notes"]);
    excessItemsAll().forEach(it=>{const c=get(xl,it.id,"now"),n=N[it.id]||0;
      o.push([secTitle(it),it.name,unitPlural(it),c??"",n||"",c!==null&&c<n?fmt(n-c):"",L.cfg.comments[it.id]||""]);});
  });
  return "\ufeff"+o.map(r=>r.map(csvCell).join(",")).join("\r\n");
}
const pt=t=>String(t??"").replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[–—−]/g,"-");
function buildPDF(){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"letter"});
  const Lm=40;let y=48;const head={fillColor:[30,79,156],textColor:255,fontStyle:"bold"};
  const H=(txt,size=13)=>{if(y>700){doc.addPage();y=48;}doc.setFont("helvetica","bold");doc.setFontSize(size);doc.setTextColor(0);doc.text(pt(txt),Lm,y);y+=8;};
  const tbl=(hd,body,opts={})=>{doc.autoTable(Object.assign({startY:y,margin:{left:Lm,right:Lm},headStyles:head,styles:{fontSize:9}},opts,{head:[hd],body:body.map(r=>r.map(pt))}));y=doc.lastAutoTable.finalY+22;};
  const tid=curTour();const t=tourById(tid);
  doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("Medical Supply Inventory",Lm,y);y+=20;
  doc.setFontSize(13);doc.text(pt(tid?(t?orgLabel(t):sessName(tid)):"No tournament selected"),Lm,y);y+=16;
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(100);
  if(t){doc.text(pt([`${num(t.courts)} courts`,`${num(t.locs)} AT locations`,`${num(t.days)} days`].filter(Boolean).join(", ")),Lm,y);y+=14;}
  doc.text(pt(`Exported ${new Date().toLocaleString()}${L.name?` by ${L.name}`:""}`),Lm,y);y+=26;
  const center={halign:"center"};
  if(tid){
    const bx=curBoxes().filter(b=>sessionHasCounts(tid,b.id)||((t&&t.boxes)||[]).includes(b.id));
    bx.forEach(b=>{H(boxName(b.id));
      tbl(["Item","Full box","Pre","Post","Used","Restock"],boxRows(tid,b.id).map(r=>[r.it.name,qty(r.it,r.full),r.pre??"-",r.post??"-",r.used,r.restock]),
        {columnStyles:{2:center,3:center,4:center,5:{halign:"center",fontStyle:"bold",textColor:[192,57,30]}}});});
  }
  H(`${curOrg()} order list (all upcoming ${curOrg()} tournaments)`);
  const O=orderRows(upcoming());
  if(O.length)tbl(["Item","Needed","In excess","To order"],O.map(r=>[r.it.name,qty(r.it,r.need),r.ex===null?"-":r.ex,qty(r.it,r.order)]),
    {columnStyles:{2:center,3:{fontStyle:"bold",textColor:[192,57,30]}}});
  else{y+=6;doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text("Nothing needed.",Lm,y);y+=22;}
  const N=needs(upcoming());
  H(`${curOrg()} excess inventory`);
  tbl(["Item","On hand","Needed","Short"],excessItemsAll().map(it=>{const c=get(excessLoc(),it.id,"now"),n=N[it.id]||0;
    return [it.name+(unitPlural(it)?` (${unitPlural(it)})`:"")+(L.cfg.comments[it.id]?`\nNote: ${L.cfg.comments[it.id]}`:""),c??"-",n||"",c!==null&&c<n?fmt(n-c):""];}),
    {columnStyles:{1:center,2:center,3:{halign:"center",fontStyle:"bold",textColor:[192,57,30]}}});
  const P=doc.getNumberOfPages();
  for(let p=1;p<=P;p++){doc.setPage(p);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(120);
    doc.text(`Page ${p} of ${P}`,doc.internal.pageSize.getWidth()-Lm,doc.internal.pageSize.getHeight()-20,{align:"right"});}
  return doc.output("blob");
}
const fileBase=()=>{const n=curTour()?sessName(curTour()):"inventory";return n.replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()||"inventory";};
$("#pdf").onclick=()=>{if(!window.jspdf){toast("PDF tools didn’t load. Check your connection and reload.");return;}
  try{saveFile(`${fileBase()}-${stamp()}.pdf`,buildPDF(),"application/pdf");}catch(e){toast("Couldn’t build the PDF");}};
$("#csv").onclick=()=>{try{saveFile(`medical-inventory-history-${stamp()}.csv`,buildCSV(),"text/csv;charset=utf-8");}catch(e){toast("Couldn’t build the CSV");}};

/* ---------- connect ---------- */
function showConnect(err){
  const d=$("#connect");$("#k-name").value=L.name;$("#k-err").textContent=err||"";openDlg(d);
}
$("#k-go").onclick=async()=>{
  const name=$("#k-name").value.trim(),code=$("#k-code").value.trim();
  if(!name||!code){$("#k-err").textContent="Enter your name and the team code.";return;}
  L.name=name;L.code=code;persist();$("#k-err").textContent="Checking…";
  try{const r=await api({action:"load"});
    if(!r.ok){$("#k-err").textContent=r.error==="bad_code"?"That team code didn’t work.":"Couldn’t connect. Try again.";L.code="";persist();return;}
    closeDlg($("#connect"));await load();render();
  }catch(e){$("#k-err").textContent="Couldn’t reach the inventory. Check your connection.";}
};
$("#connect").addEventListener("cancel",e=>e.preventDefault());

/* ---------- start ---------- */
render();
if(LOCAL){setSync("local");}
else if(!L.code){setSync("idle");showConnect();}
else{setSync(Object.keys(L.pending).length?"offline":"idle");load().then(ok=>{if(ok)softRefresh();});scheduleFlush(500);}
if(!LOCAL){
  setInterval(()=>{if(document.visibilityState==="visible"&&L.code&&!flushing)load().then(()=>softRefresh());},20000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&L.code){flush();load().then(()=>softRefresh());}});
  window.addEventListener("online",()=>{flush();});
}
})();
</script>
</body>
